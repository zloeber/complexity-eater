name: Release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read

jobs:
  tag:
    name: semantic release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Release only the commit CI verified
        id: gate
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install zsh
        if: steps.gate.outputs.proceed == 'true'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Configure git
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Semantic release
        id: release
        if: steps.gate.outputs.proceed == 'true'
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4.2.2
        with:
          semantic_version: 24
          # Preset 10 requires conventional-changelog-writer 9.
          # semantic-release 24 loads writer 8, so an unpinned install fails in generateNotes.
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build binaries for the new tag
        if: steps.gate.outputs.proceed == 'true' && steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release-binaries.yml --ref main -f tag=v${{ steps.release.outputs.new_release_version }}
      - name: Publish the workspace version when nothing is tagged yet
        if: steps.gate.outputs.proceed == 'true' && steps.release.outputs.new_release_published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zsh scripts/publish-initial-release.zsh "${{ github.event.workflow_run.head_sha }}"
