name: Release binaries

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Semver tag to build, including the leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            apt: ""
            cc: ""
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            cc: aarch64-linux-gnu-gcc
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            apt: ""
            cc: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            apt: ""
            cc: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux cross linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build ce
        env:
          TARGET: ${{ matrix.target }}
          CC_TARGET: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          if [ -n "${CC_TARGET}" ]; then
            key="${TARGET//-/_}"
            upper="$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]')"
            export "CC_${key}=${CC_TARGET}"
            export "CARGO_TARGET_${upper}_LINKER=${CC_TARGET}"
          fi
          cargo build --release --locked --bin ce --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/pkg
          cp "target/${TARGET}/release/ce" dist/pkg/ce
          chmod 755 dist/pkg/ce
          tar -C dist/pkg -czf "dist/ce-${NAME}.tar.gz" ce
      - uses: actions/upload-artifact@v4
        with:
          name: ce-${{ matrix.name }}
          path: dist/ce-${{ matrix.name }}.tar.gz

  publish:
    name: attach archives
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ce-*
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.tar.gz | sort > SHA256SUMS
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
