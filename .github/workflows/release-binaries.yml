name: Release binaries

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Semver tag to build, including the leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Require a semver tag on main
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          python3 - "$tag" <<'PY'
          import re
          import sys
          tag = sys.argv[1]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"refusing tag {tag}")
          PY
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "tag ${tag} is not on main" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            apt: ""
            cc: ""
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            cc: aarch64-linux-gnu-gcc
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            apt: ""
            cc: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            apt: ""
            cc: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Read toolchain
        id: rust
        run: echo "channel=$(zsh scripts/print-rust-toolchain.zsh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.target }}
      - name: Install Linux cross linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build ce
        env:
          TARGET: ${{ matrix.target }}
          CC_TARGET: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          if [ -n "${CC_TARGET}" ]; then
            key="${TARGET//-/_}"
            upper="$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]')"
            export "CC_${key}=${CC_TARGET}"
            export "CARGO_TARGET_${upper}_LINKER=${CC_TARGET}"
          fi
          cargo build --release --locked --bin ce --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/pkg
          cp "target/${TARGET}/release/ce" dist/pkg/ce
          chmod 755 dist/pkg/ce
          tar -C dist/pkg -czf "dist/ce-${NAME}.tar.gz" ce
      - name: Install supply-chain tools
        run: zsh scripts/install-supply-chain-tools.zsh
      - name: Add tools to PATH
        run: echo "$GITHUB_WORKSPACE/target/supply-chain-bin" >> "$GITHUB_PATH"
      - name: Binary hardening
        run: zsh scripts/check-binary-hardening.zsh "target/${{ matrix.target }}/release/ce"
      - name: Scan the archive
        run: zsh scripts/scan-artifact.zsh file "dist/ce-${{ matrix.name }}.tar.gz"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ce-${{ matrix.name }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ce-${{ matrix.name }}
          path: dist/ce-${{ matrix.name }}.tar.gz

  sbom:
    name: application sbom
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Read toolchain
        id: rust
        run: echo "channel=$(zsh scripts/print-rust-toolchain.zsh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Install supply-chain tools
        run: zsh scripts/install-supply-chain-tools.zsh
      - name: Add tools to PATH
        run: echo "$GITHUB_WORKSPACE/target/supply-chain-bin" >> "$GITHUB_PATH"
      - name: CycloneDX SBOM
        run: zsh scripts/generate-sbom.zsh ce.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ce-sbom
          path: ce.cdx.json

  image:
    name: container image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install supply-chain tools
        run: zsh scripts/install-supply-chain-tools.zsh
      - name: Add tools to PATH
        run: echo "$GITHUB_WORKSPACE/target/supply-chain-bin" >> "$GITHUB_PATH"
      - name: Image metadata
        id: version
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("Cargo.toml").read_text()
          match = re.search(r'(?ms)^\[workspace\.package\][^\[]*?^version = "([^"]+)"', text)
          if not match:
              raise SystemExit("workspace version was not found")
          print(match.group(1))
          PY
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository }}:ci-${{ needs.gate.outputs.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ needs.gate.outputs.sha }}
            CREATED=${{ steps.version.outputs.created }}
            SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ce-image
          cache-to: type=gha,scope=ce-image,mode=max
      - name: Scan the pushed image
        id: scan
        run: zsh scripts/scan-artifact.zsh image "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
      - name: Publish the version tag
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${{ needs.gate.outputs.tag }}" \
            "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
      - name: Image SBOM
        run: trivy image --format cyclonedx --output ce-image.cdx.json "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ce-image.cdx.json
          push-to-registry: true
      - name: Record the image digest
        run: |
          set -euo pipefail
          printf '%s  ghcr.io/%s:%s\n' "${{ steps.push.outputs.digest }}" "${{ github.repository }}" "${{ needs.gate.outputs.tag }}" > image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ce-image-sbom
          path: |
            ce-image.cdx.json
            image-digest.txt
      - name: Remove the CI tag
        if: always() && steps.push.outcome == 'success'
        run: zsh scripts/delete-ghcr-tag.zsh "${{ github.repository_owner }}" "${{ github.event.repository.name }}" "ci-${{ needs.gate.outputs.sha }}"

  publish:
    name: attach archives
    needs: [gate, build, sbom, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: ce-*
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * | sort > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/SHA256SUMS
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            artifacts/ce-linux-x86_64.tar.gz
            artifacts/ce-linux-aarch64.tar.gz
            artifacts/ce-macos-aarch64.tar.gz
            artifacts/ce-macos-x86_64.tar.gz
          sbom-path: artifacts/ce.cdx.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
