name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Read toolchain
        id: rust
        run: echo "channel=$(zsh scripts/print-rust-toolchain.zsh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  supply-chain:
    name: audit, deny, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Read toolchain
        id: rust
        run: echo "channel=$(zsh scripts/print-rust-toolchain.zsh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Install supply-chain tools
        run: zsh scripts/install-supply-chain-tools.zsh
      - name: Add tools to PATH
        run: echo "$GITHUB_WORKSPACE/target/supply-chain-bin" >> "$GITHUB_PATH"
      - name: RustSec gate
        run: zsh scripts/cargo-audit-gate.zsh
      - name: Dependency policy
        run: cargo deny check
      - name: Secret scan
        run: gitleaks detect --source . --redact --no-banner

  binary:
    name: release binary scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Read toolchain
        id: rust
        run: echo "channel=$(zsh scripts/print-rust-toolchain.zsh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Release build
        run: cargo build --release --locked --bin ce
      - name: Install supply-chain tools
        run: zsh scripts/install-supply-chain-tools.zsh
      - name: Add tools to PATH
        run: echo "$GITHUB_WORKSPACE/target/supply-chain-bin" >> "$GITHUB_PATH"
      - name: Binary hardening
        run: zsh scripts/check-binary-hardening.zsh target/release/ce
      - name: Scan the release binary
        run: zsh scripts/scan-artifact.zsh file target/release/ce

  image:
    name: container scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install supply-chain tools
        run: zsh scripts/install-supply-chain-tools.zsh
      - name: Add tools to PATH
        run: echo "$GITHUB_WORKSPACE/target/supply-chain-bin" >> "$GITHUB_PATH"
      - name: Build, scan, and run the hardened image
        run: zsh scripts/verify-container.zsh
