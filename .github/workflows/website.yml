name: website

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy static site
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'website-production' || 'website-preview' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Build and check the public website
        run: zsh scripts/check-website.zsh
      - name: Cloudflare credentials
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy. CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set."
          fi
      - name: Preview branch
        id: branch
        if: steps.cloudflare.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            name="${GITHUB_HEAD_REF}"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            name="main"
          else
            name="${GITHUB_REF_NAME}"
          fi
          name="${name//\//-}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"
          packageManager: npm
          workingDirectory: website
          command: pages deploy dist --project-name=complexity-eater --branch=${{ steps.branch.outputs.name }} --commit-dirty=true
