# Dependency policy for Complexity Eater.
# The application is MIT licensed and is distributed as source and as native
# binaries. Dependencies must come from crates.io and use licenses that allow
# that distribution.
#
# `cargo deny check` fails on advisory vulnerabilities, forbidden licenses,
# wildcard requirements, and non-crates.io sources. Duplicate versions warn.
# A warning is still printed; it does not waive the finding.
#
# To waive a finding, add one entry with a reason and an expiry. Do not silence
# a whole class of findings. Remove the entry when the expiry lands or when the
# upstream fix is in the lockfile.
#
# Advisories:
#   ignore = [
#     { id = "RUSTSEC-0000-0000", reason = "why this build is still safe", expires = "2026-12-31" },
#   ]

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
# "workspace" reports unmaintained and unsound crates used directly by this
# workspace. Transitive unmaintained crates stay visible in `cargo audit`.
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
]
exceptions = []

[licenses.private]
ignore = true

[bans]
# Duplicate crate versions warn instead of failing. The current duplicates are
# transitive: base64 0.22 and 0.23, hashbrown 0.14 and 0.17, and syn 2 and 3.
# A skip entry needs a reason. Do not add one just to hide the warning.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
