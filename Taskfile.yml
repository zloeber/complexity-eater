version: "3"

tasks:
  setup:
    desc: Fetch the locked dependency graph
    cmds:
      - cargo fetch --locked

  check:
    desc: Format, lint, and test
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --all-targets --locked -- -D warnings
      - cargo test --workspace --locked

  test:
    desc: Run unit and integration tests
    cmds:
      - cargo test --workspace --locked

  lint:
    desc: Run clippy with warnings denied
    cmds:
      - cargo clippy --all-targets --locked -- -D warnings

  build:
    desc: Build the ce binary in debug mode
    cmds:
      - cargo build --locked --bin ce

  e2e:
    desc: Run the CLI, dialer, and proposal lifecycle tests
    cmds:
      - cargo test --locked -p ce-cli --test parity

  release:
    desc: Build the stripped release binary
    cmds:
      - cargo build --release --locked --bin ce

  tools:
    desc: Install pinned supply-chain scanners
    cmds:
      - zsh scripts/install-supply-chain-tools.zsh

  supply-chain:
    desc: Audit advisories, licenses, and secrets
    cmds:
      - zsh scripts/install-supply-chain-tools.zsh
      - export PATH="$PWD/target/supply-chain-bin:$PATH" && zsh scripts/cargo-audit-gate.zsh
      - export PATH="$PWD/target/supply-chain-bin:$PATH" && cargo deny check
      - export PATH="$PWD/target/supply-chain-bin:$PATH" && gitleaks detect --source . --redact --no-banner

  binary-hardening:
    desc: Build the release binary and check platform hardening
    cmds:
      - cargo build --release --locked --bin ce
      - zsh scripts/check-binary-hardening.zsh target/release/ce

  image:
    desc: Build the production container image
    cmds:
      - zsh scripts/build-image.zsh

  image-verify:
    desc: Build, scan, and run the hardened container profile
    cmds:
      - zsh scripts/install-supply-chain-tools.zsh
      - export PATH="$PWD/target/supply-chain-bin:$PATH" && zsh scripts/verify-container.zsh

  repro:
    desc: Compare two clean release builds and report whether the bytes match
    cmds:
      - zsh scripts/compare-release-builds.zsh

  parity:
    desc: Run the full Rust parity suite
    cmds:
      - cargo test --workspace --locked

  website:build:
    desc: Build the public website into website/dist
    cmds:
      - zsh scripts/build-website.zsh

  website:check:
    desc: Build the public website and check links, contract, and release assets
    cmds:
      - zsh scripts/check-website.zsh

  website:preview:
    desc: Serve the public website on 127.0.0.1:4173
    cmds:
      - zsh scripts/build-website.zsh
      - python3 -m http.server 4173 --bind 127.0.0.1 --directory website/dist
